<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-label="システム構成図">
<style>
:root { --bg:#ffffff; --card:#f6f8fa; --border:#d0d7de; --ink:#1f2328; --muted:#59636e; --line:#6e7781; --cf:#fff5eb; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --ink:#e6edf3; --muted:#9198a1; --line:#8b949e; --cf:#26190d; }
}
text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans CJK JP","Yu Gothic",sans-serif; }
.bg { fill:var(--bg); }
.card, .inner { fill:var(--card); stroke:var(--border); stroke-width:1.5; }
.inner { fill:var(--bg); }
.cf { fill:var(--cf); stroke:#f38020; stroke-width:2; }
.title { fill:var(--ink); font-size:16px; font-weight:700; }
.small { font-size:15px; }
.sub { fill:var(--muted); font-size:12.5px; }
.label { fill:var(--muted); font-size:12.5px; font-weight:600; }
.line { fill:none; stroke:var(--line); stroke-width:2; }
.dashed { stroke-dasharray:6 5; }
.head { fill:var(--line); }
.ink { fill:var(--ink); }
</style>
